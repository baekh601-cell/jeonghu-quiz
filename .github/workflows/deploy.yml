# main 에 push 되면(웹에서 이미지 업로드 포함) 이미지를 변환하고 GitHub Pages 로 배포한다.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:assets
      - run: npm run build:www # 배포할 파일만 www/ 로 모으기 (안드로이드 앱도 같은 결과물)
      # 시험용 B 버전: versus-online 브랜치를 /b/ 주소에 함께 올린다 (브랜치가 없으면 건너뜀)
      - name: B 버전(versus-online) 받기
        id: b
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: versus-online
          path: _b
      - name: B 버전을 /b/ 에 빌드
        if: steps.b.outcome == 'success'
        run: |
          ln -s ../node_modules _b/node_modules
          cp -rn assets/raw/. _b/assets/raw/ # main 에 새로 올린 그림도 B 에 (B 에 같은 이름이 있으면 그대로 둠)
          cd _b
          npm run build:assets
          npm run build:www
          cd ..
          cp -r _b/www www/b
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
