# main 에 push 되면(웹에서 이미지 업로드 포함) 이미지를 변환하고 GitHub Pages 로 배포한다.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:assets
      - name: 배포할 파일만 모으기
        run: |
          mkdir -p _site/data _site/assets _site/js
          cp js/*.js _site/js/
          cp index.html style.css sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png _site/
          cp data/*.js _site/data/
          cp -r assets/fonts _site/assets/
          if [ -d assets/img ]; then cp -r assets/img _site/assets/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
